name: Hosted gate

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    name: Python, C++ and hand goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REPORTS: ${{ runner.temp }}/ci-reports
      CPP_BUILD: ${{ runner.temp }}/room-memory-build
      ROOM_MEMORY_RECORDING: ${{ runner.temp }}/absent-recordings/static5m
      ROOM_MEMORY_RECORDING_B: ${{ runner.temp }}/absent-recordings/static5m-b
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: -rs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: spark/requirements-ci.txt
      - name: Install non-ROS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake zlib1g-dev libzstd-dev
          python -m pip install -r spark/requirements-ci.txt < /dev/null
          python -m pip check
          python -c 'import numpy, pytest, mcap, zstandard'
          python --version
          cmake --version
          c++ --version
          mkdir -p "$REPORTS"
          test ! -e "$ROOM_MEMORY_RECORDING"
          test ! -e "$ROOM_MEMORY_RECORDING_B"
      - name: Check CI helpers and committed fixtures
        run: |
          python -m unittest discover -s .github/scripts -p 'test_*.py' < /dev/null
          python .github/scripts/ci_checks.py fixtures "$GITHUB_WORKSPACE"
      - name: Python tests
        id: pytest
        working-directory: spark
        timeout-minutes: 20
        run: python -m pytest -q -rs --junitxml="$REPORTS/pytest.xml" < /dev/null
      - name: Configure non-ROS C++ targets
        id: configure
        run: |
          cmake -S spark/room_memory_cpp -B "$CPP_BUILD" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DROOM_MEMORY_BUILD_NODE=OFF -DROOM_MEMORY_NATIVE=OFF \
            -DROOM_MEMORY_PYTHON="$(command -v python)"
          # Without zstd the recording binaries return 77 for the wrong reason.
          grep -E '^ROOM_MEMORY_ZSTD_INCLUDE:PATH=/' "$CPP_BUILD/CMakeCache.txt"
          grep -E '^ROOM_MEMORY_ZSTD_LIBRARY:FILEPATH=/' "$CPP_BUILD/CMakeCache.txt"
      - name: Build C++ targets
        id: cpp_build
        timeout-minutes: 15
        run: cmake --build "$CPP_BUILD" --parallel 2 < /dev/null
      - name: CTest (including explicit absent-dataset skips)
        id: ctest
        timeout-minutes: 60
        run: |
          ctest --test-dir "$CPP_BUILD" --parallel 1 --no-tests=error \
            --output-on-failure --verbose --output-junit "$REPORTS/ctest.xml" < /dev/null
      - name: Test counts and skip reasons
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.cpp_build.outcome }}
          CTEST_OUTCOME: ${{ steps.ctest.outcome }}
        run: |
          {
            printf '## Ubuntu gate\n\n'
            printf 'Step outcomes: pytest=%s; configure=%s; C++ build=%s; CTest=%s.\n\n' \
              "$PYTEST_OUTCOME" "$CONFIGURE_OUTCOME" "$BUILD_OUTCOME" "$CTEST_OUTCOME"
            python .github/scripts/ci_checks.py summary "$REPORTS"
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: Swift core tests and app build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Swift core tests
        id: core
        timeout-minutes: 15
        run: swift run LabCommandCoreTestsRunner < /dev/null
      - name: Build app product
        id: app
        timeout-minutes: 15
        run: swift build -c release --product LabCommand < /dev/null
      - name: Swift summary
        if: always()
        env:
          CORE_OUTCOME: ${{ steps.core.outcome }}
          APP_OUTCOME: ${{ steps.app.outcome }}
        run: |
          {
            printf '## macOS gate\n\n'
            printf -- '- Core test runner: %s\n- App build: %s\n\n' "$CORE_OUTCOME" "$APP_OUTCOME"
            printf 'A skipped step was not run. This job compiles the app without launching or installing it.\n'
          } >> "$GITHUB_STEP_SUMMARY"
