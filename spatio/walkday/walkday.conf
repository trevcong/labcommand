# Walk-day settings, sourced by spatio/walkday/process.sh (override: --settings FILE).
# Every value here is a parameter of the pipeline, not of any one recording.
# Keep one settings file per three-run series: a change starts a new series.

# Walk checker (spatio.walkcheck). The 0.10 m return gate is fixed by the
# milestone and lives in spatio/thresholds.py; it is not set here.
STATIONARY_WINDOW_S=5        # provisional (approved for now, revisit after real data)
MAX_GAP_S=1.0                # provisional (approved for now, revisit after real data)
MIN_PATH_LENGTH_M=2.0        # provisional (approved for now, revisit after real data)
MIN_EXCURSION_M=0.5          # provisional (approved for now, revisit after real data)
# NOT in the approved list. The walk checker's builder picked these after
# looking at the Aug 8 replays. Kept only as half the 0.10 m gate (spread) and
# a crawl (speed); NEEDS TREVOR'S APPROVAL before scored runs.
MAX_ENDPOINT_SPREAD_M=0.05
MAX_ENDPOINT_SPEED_M_S=0.10

# Hold detection (walkcheck #60). NOT APPROVED; need Trevor's approval.
# Known mismatch, left for Trevor to decide: a bare `python3 -m spatio.walkcheck`
# still defaults to 0.02 m/s (spatio/walkcheck/holds.py), not this 0.10.
# walkcheck's own default hold speed (0.02 m/s per 10 Hz pose step) is below
# FAST-LIO's pose jitter on a perfectly parked SYNTHETIC cart, so no hold was
# ever found. Derived, not swept: parked per-step speed over 1,262 synthetic
# parked steps (7 runs) p95 2.2, p99 3.1, max 7.0 cm/s; steady pushing
# (cosine ramps excluded) min 17.3, median 32.5 cm/s. 0.10 m/s sits above the
# parked max (x1.4) and below the slowest push (/1.7), and equals
# MAX_ENDPOINT_SPEED_M_S. Real Mid-360 parked jitter is unmeasured: the
# preflight walk must measure it before scored runs.
MAX_HOLD_SPEED_M_S=0.10
MIN_HOLD_S=8                 # walkcheck's provisional default, listed for approval

# Walls: gate and its approval state as written into walk_result.json.
# process.sh passes WALL_GATE_M to walkcheck, wallpatch measure and the result
# (--wall-gate-m). The code default is spatio/thresholds.py WALL_GATE_M; the
# 4 cm guard band under it lives there too and is not set here.
# Stricter-only: positive values up to 0.05 m; larger values stop with exit 2.
WALL_GATE_M=0.05             # provisional (approved for now, revisit after real data)
WALL_GATE_STATE=approved
# Without --patches FILE, this many patches are auto-suggested from each map.
SUGGEST_PATCHES=2

# Input inspection (x1): decode per-point timing of every Nth scan (1 = all).
BAGTIMING_SAMPLE_EVERY=1

# Replay: map_display.pcd voxel (m, display only) and playback rate. The
# scoring map.pcd is every finite registered point, not voxelized (replay.sh).
MAP_VOXEL_M=0.03
PLAYBACK_RATE=1.0
